# ── DeckScout — public vhost fragment ───────────────────────────────────────
# Target: the :443 server{} block of /etc/nginx/sites-available/brain-public
#         (server_name cheyrasnet.tplinkdns.com).
#
# Must go INSIDE the :443 server block, which already has (once, at server scope):
#   include /etc/nginx/snippets/authelia-authrequest.conf;
# That defines the /internal/authelia/authz endpoint that authelia-protect.conf calls.
# Apply by pasting, or by adding one line inside the :443 server block:
#   include /home/cheyras/pokedex/deploy/nginx-brain-public-pokedex.conf;
#
# All gated blocks are Authelia 1FA-gated, exactly like /git/ and /api/lumina/ in this
# file (include authelia-protect.conf first, then the location body). Same route facts
# as the LAN fragment.

# Legacy /pokedex/* URLs (pre-rename bookmarks, installed PWAs) → permanent redirect.
location ~ ^/pokedex(/.*)?$ { return 301 /deckscout$1; }

# REST API → pokedex-api :3700 (Authelia-gated)
location /deckscout/api/ {
    include /etc/nginx/snippets/authelia-protect.conf;
    proxy_pass http://127.0.0.1:3700/deckscout/api/;
    include /etc/nginx/snippets/proxy.conf;
}

# Cached card art → pokedex-images :3701 (Authelia-gated)
location /deckscout/images/ {
    include /etc/nginx/snippets/authelia-protect.conf;
    proxy_pass http://127.0.0.1:3701/deckscout/images/;
    include /etc/nginx/snippets/proxy.conf;
}

# SPA shell + built assets + deep client routes → pokedex-api :3700 (Authelia-gated).
# NOTE: authelia-protect.conf turns a 401 into a 302 to the portal. Correct for the
# initial HTML load, but an expired session makes /deckscout/api/* and asset fetches
# redirect to the login page rather than return 401 — same behaviour the other gated
# SPAs on this box have. Fine for now; revisit when the PWA/service-worker layer lands
# (a redirected asset fetch can confuse a SW cache).
location = /deckscout { return 301 /deckscout/; }

# App icons + PWA manifest are served WITHOUT Authelia: iOS fetches the
# apple-touch-icon (and Android the manifest icons) outside the page's session,
# so gating them yields a 302→portal and the home-screen icon falls back to a
# generated letter tile. These files are non-sensitive static images.
location ~ ^/deckscout/(apple-touch-icon\.png|favicon\.ico|favicon-32\.png|brand-icon\.png|pwa-(?:maskable-)?(?:192|512)\.png|manifest\.webmanifest)$ {
    proxy_pass http://127.0.0.1:3700;
    include /etc/nginx/snippets/proxy.conf;
}

location /deckscout/ {
    include /etc/nginx/snippets/authelia-protect.conf;
    proxy_pass http://127.0.0.1:3700/deckscout/;
    include /etc/nginx/snippets/proxy.conf;
}
