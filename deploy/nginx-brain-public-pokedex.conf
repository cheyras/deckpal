# ── pokedex — public vhost fragment ─────────────────────────────────────────
# Target: the :443 server{} block of /etc/nginx/sites-available/brain-public
#         (server_name cheyrasnet.tplinkdns.com).
#
# ⚠ NOT ACTIVATED. Apply per deploy/DEPLOY.md, Stage C. Do NOT reload nginx
#   without the user's OK.
#
# Must go INSIDE the :443 server block, which already has (once, at server scope):
#   include /etc/nginx/snippets/authelia-authrequest.conf;
# That defines the /internal/authelia/authz endpoint that authelia-protect.conf calls.
# Apply by pasting, or by adding one line inside the :443 server block:
#   include /home/cheyras/pokedex/deploy/nginx-brain-public-pokedex.conf;
#
# All three blocks are Authelia 1FA-gated, exactly like /git/ and /api/lumina/ in this
# file (include authelia-protect.conf first, then the location body). Same route facts
# as the LAN fragment.

# REST API → pokedex-api :3700 (Authelia-gated)
location /pokedex/api/ {
    include /etc/nginx/snippets/authelia-protect.conf;
    proxy_pass http://127.0.0.1:3700/pokedex/api/;
    include /etc/nginx/snippets/proxy.conf;
}

# Cached card art → pokedex-images :3701 (Authelia-gated)
location /pokedex/images/ {
    include /etc/nginx/snippets/authelia-protect.conf;
    proxy_pass http://127.0.0.1:3701/pokedex/images/;
    include /etc/nginx/snippets/proxy.conf;
}

# SPA shell + built static assets → nginx from apps/web/dist (Authelia-gated).
# NOTE: authelia-protect.conf turns a 401 into a 302 to the portal. That is correct for
# the initial HTML load, but means an expired session makes /pokedex/api/* fetches and
# static-asset fetches redirect to the login page rather than return 401 — same behaviour
# the other gated SPAs on this box have. Fine for now; revisit when the PWA/offline layer
# and its service worker land (a redirected asset fetch can confuse a SW cache).
location = /pokedex { return 301 /pokedex/; }
location /pokedex/ {
    include /etc/nginx/snippets/authelia-protect.conf;
    alias /home/cheyras/pokedex/apps/web/dist/;
    try_files $uri $uri/ /pokedex/index.html;
}
