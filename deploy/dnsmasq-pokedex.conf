# pokedex — split-horizon DNS drop-in.
# Ref: DECISIONS.md 2026-07-24 "LAN HTTPS via split-horizon DNS"; ARCHITECTURE §9.1.
#
# ⚠ NOT ACTIVATED. Do NOT copy into /etc/dnsmasq.d/ or restart dnsmasq without the
#   user's OK. Apply per deploy/DEPLOY.md, Stage D (record → apply → verify → rollback).
#
# What it does: makes LAN clients resolve the PUBLIC hostname to the Pi's LAN IP, so the
# existing Let's Encrypt certificate serves them over HTTPS. That turns
# https://cheyrasnet.tplinkdns.com/pokedex/ into a *secure context* on the LAN — the
# precondition for the PWA / service worker / install / offline (all impossible over the
# plaintext http://the.grid/ LAN vhost, ARCHITECTURE §9.1).
#
# ⚠ Blast radius: this changes DNS resolution for EVERY service reachable at that
#   hostname, not just pokedex — LAN clients will now reach ALL of brain-public over the
#   LAN path, and traverse Authelia there too. Verify each service still resolves and
#   serves after applying (DEPLOY.md Stage D), and roll back on any regression.

address=/cheyrasnet.tplinkdns.com/192.168.68.76
