# ── rotom-mcp — LAN vhost fragment ──────────────────────────────────────────
# Target: the server{} block of /etc/nginx/sites-available/thegrid
#         (listen 80; server_name thegrid thegrid.local).
#
# Apply by adding one line inside that server{} block:
#   include /home/cheyras/pokedex/deploy/nginx-thegrid-rotom-mcp.conf;
#
# Mirrors the box's /todoist/mcp LAN convention: no nginx auth on LAN — auth is
# the app-layer x-brain-key (Claude Code / Desktop send the header themselves).
# Streaming settings are explicit because /etc/nginx/snippets/proxy.conf has no
# buffering/timeout stanza and MCP streamable HTTP uses SSE.

location /rotom/mcp {
    proxy_pass http://127.0.0.1:3704/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
