# ── pokedex — LAN vhost fragment ────────────────────────────────────────────
# Target: the server{} block of /etc/nginx/sites-available/thegrid
#         (listen 80; server_name thegrid thegrid.local).
#
# Apply by adding one line inside that server{} block:
#   include /home/cheyras/pokedex/deploy/nginx-thegrid-pokedex.conf;
#
# The SPA is served by pokedex-api (:3700) ITSELF, not by nginx static. This matches
# the box convention — every first-party app (lumina, colorsplash, fuel) serves its
# own frontend on its own port and nginx only proxies. It also avoids nginx's
# www-data worker needing to traverse the 700 $HOME (setfacl isn't even installed).
#
# Route facts (verified against the running apps):
#   - pokedex-api mounts /pokedex/api AND serves the SPA (static assets + client-route
#     fallback to index.html) for everything else under /pokedex/.
#   - pokedex-images serves /pokedex/images/<lang>/<serie>/<set>/<localId>/<file>.
# nginx matches longest-prefix, so /pokedex/api/ and /pokedex/images/ win over
# /pokedex/ regardless of block order.

# Bare /pokedex (no trailing slash) → normalize.
location = /pokedex { return 301 /pokedex/; }

# REST API → pokedex-api :3700
location /pokedex/api/ {
    proxy_pass http://127.0.0.1:3700/pokedex/api/;
    include /etc/nginx/snippets/proxy.conf;
}

# Cached card art → pokedex-images :3701 (sends its own immutable cache headers on hit).
location /pokedex/images/ {
    proxy_pass http://127.0.0.1:3701/pokedex/images/;
    include /etc/nginx/snippets/proxy.conf;
}

# SPA shell + built assets + deep client routes → pokedex-api :3700 (Express serves
# express.static(apps/web/dist) with an index.html fallback for non-/api GETs).
location /pokedex/ {
    proxy_pass http://127.0.0.1:3700/pokedex/;
    include /etc/nginx/snippets/proxy.conf;
}
