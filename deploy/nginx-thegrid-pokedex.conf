# ── pokedex — LAN vhost fragment ────────────────────────────────────────────
# Target: the server{} block of /etc/nginx/sites-available/thegrid
#         (listen 80; server_name thegrid thegrid.local).
#
# ⚠ NOT ACTIVATED. Apply per deploy/DEPLOY.md, Stage B. Do NOT reload nginx
#   without the user's OK — six pm2 services depend on this nginx (project CLAUDE.md).
#
# Apply either by pasting these blocks into the server{} block, or by adding one line
# inside it:
#   include /home/cheyras/pokedex/deploy/nginx-thegrid-pokedex.conf;
# (nginx reads this at reload time as root, so the /home path is fine for the include;
#  the static `alias` below is served per-request by the www-data worker — see
#  DEPLOY.md "Filesystem permissions" for the one ACL that must be granted first.)
#
# Route facts (verified against the running apps, not assumed):
#   - pokedex-api mounts its router at  /pokedex/api  (apps/api/src/index.ts:
#     `app.use('/pokedex/api', api)`) — so proxy_pass keeps the /pokedex/api/ prefix.
#   - pokedex-images serves             /pokedex/images/<lang>/<serie>/<set>/<localId>/<file>
#   - the frontend is built with base=/pokedex/ (index.html references /pokedex/assets/…).
# nginx matches longest-prefix, so /pokedex/api/ and /pokedex/images/ win over /pokedex/
# regardless of block order.

# REST API → pokedex-api :3700
location /pokedex/api/ {
    proxy_pass http://127.0.0.1:3700/pokedex/api/;
    include /etc/nginx/snippets/proxy.conf;
}

# Cached card art → pokedex-images :3701.
# The image service already sends `Cache-Control: public, max-age=31536000, immutable`
# on hits, so no extra nginx `expires` is needed (and must not override no-store on MISS).
location /pokedex/images/ {
    proxy_pass http://127.0.0.1:3701/pokedex/images/;
    include /etc/nginx/snippets/proxy.conf;
}

# SPA shell + built static assets → served directly by nginx from apps/web/dist.
# Bare /pokedex (no trailing slash) would not match the prefix block below, so redirect it.
location = /pokedex { return 301 /pokedex/; }
location /pokedex/ {
    alias /home/cheyras/pokedex/apps/web/dist/;
    # Deep client-routes (e.g. /pokedex/set/base1) have no file on disk → fall back to
    # the app shell. The fallback is an absolute URI, so it re-enters location matching
    # and resolves to dist/index.html via the alias (the alias+try_files-safe form).
    try_files $uri $uri/ /pokedex/index.html;
}
