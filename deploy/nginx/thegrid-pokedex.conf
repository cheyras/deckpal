# pokedex — nginx location fragment for the LAN vhost.
#
# ⚠ NOT ACTIVATED. For a later (hardening) task. Paste these blocks into
# /etc/nginx/sites-available/thegrid (server_name thegrid thegrid.local) and reload nginx
# ONLY WITH THE USER'S PERMISSION — six pm2 services depend on that nginx (project CLAUDE.md).
#
# The app serves from a sub-path, so the SPA base URL / router basename / service-worker scope
# are all "/pokedex/" (ARCHITECTURE §4).

# REST API -> pokedex-api :3700
location /api/pokedex/ {
    proxy_pass http://127.0.0.1:3700/api/pokedex/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Cached card art -> pokedex-images :3701 (long cache; immutable WebP)
location /pokedex/images/ {
    proxy_pass http://127.0.0.1:3701/pokedex/images/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# SPA static assets + app shell -> pokedex-api :3700 (serves the built frontend, a later phase)
location /pokedex/ {
    proxy_pass http://127.0.0.1:3700/pokedex/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
