# ── rotom-mcp — public vhost fragment ───────────────────────────────────────
# Target: the server{} block of /etc/nginx/sites-available/brain-public
#         (cheyrasnet.tplinkdns.com:443, TLS).
#
# Apply by adding one line inside that server{} block:
#   include /home/cheyras/pokedex/deploy/nginx-brain-public-rotom-mcp.conf;
#
# Same regime as the box's other MCP routes (/td-mcp, /kk-mcp, /mm-mcp):
#   1. Anthropic egress CIDR only (claude.ai / Claude iOS / Desktop connectors).
#      Claude Code on the LAN uses the thegrid vhost route instead.
#   2. nginx injects the x-brain-key so claude.ai needs no headers; the app still
#      enforces it. The snippet is NOT in this repo (it holds the secret):
#        /etc/nginx/snippets/rotom-key.conf
#        containing exactly:  proxy_set_header x-brain-key "<ROTOM_MCP_KEY from .env>";

location /rotom-mcp {
    allow 160.79.104.0/21;
    deny  all;

    include /etc/nginx/snippets/rotom-key.conf;

    proxy_pass http://127.0.0.1:3704/mcp;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;
    proxy_read_timeout      86400s;
    proxy_send_timeout      86400s;
    chunked_transfer_encoding on;
}
