# CI — every push to main (and any PR) must typecheck, pass the pure test
# suites, and build all deployables.
#
# Runner: `thegrid-pi` — HOST mode on the Pi itself, user cheyras, capacity 1
# (serial). node/pnpm come from the service PATH (~/.node-current symlink —
# see /etc/systemd/system/act_runner.service.d/path.conf).
#
# Deliberately NOT run here:
#   - test:collection (apps/api/src/__tests__) — those are live-DB integration
#     tests against the PRODUCTION pokedex database (self-cleaning, but CI
#     should never mutate prod data on every push). Run them manually.
#   - deploys — the live app runs from ~/pokedex's working tree (see
#     CLAUDE.md); pushes originate from the deployment, so there is nothing
#     to deploy after CI.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: thegrid-pi
    steps:
      # Manual checkout: host-mode runner + localhost fetch of a public repo —
      # no JS-action toolchain involved, works in a reused workspace dir.
      - name: Checkout
        run: |
          git init -q .
          git fetch --depth 1 http://localhost:3000/${{ gitea.repository }}.git "$GITHUB_SHA"
          git checkout -qf FETCH_HEAD

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck all workspaces
        run: pnpm -r --workspace-concurrency=1 exec tsc --noEmit

      - name: Deck engine + battle-log parser tests (pure, no DB)
        run: pnpm --filter pokedex-api test:deck

      - name: Build api
        run: pnpm --filter pokedex-api build

      - name: Build mcp
        run: pnpm --filter pokedex-mcp build

      - name: Build web
        run: pnpm --filter pokedex-web build
