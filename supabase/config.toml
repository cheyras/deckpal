# Supabase CLI local config.
#
# Schema management is handled by the DeckPal migration runner
# (packages/db/src/migrate.ts), NOT the Supabase CLI.  This config exists so
# that `supabase db push` can be used as a one-shot alternative for initial
# project setup, and for future Supabase CLI commands (functions, storage, etc.).
#
# The project id stays deliberately empty here: the CLI's link state (which
# project this clone talks to) lives in the gitignored supabase/.temp/, not in
# this committed file. Do not fill it in.

[project]
id = ""

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[auth]
enabled = true
site_url = "http://localhost:5173"

[auth.email]
enable_signup = true

[storage]
enabled = true
