<!doctype html>
<html lang="en" class="pkmnDark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1917" />
    <!-- iOS Home-Screen install: standalone chrome + dark status bar + app icon.
         Home-Screen install is one of the two ITP-eviction escapes (wiki: Frontend-Research §C.4);
         the manifest link is injected by vite-plugin-pwa at build. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeckPal" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />

    <!-- SEO / social. This document is the SPA shell for BOTH the marketing
         landing at / and the app behind it, and nothing in the app sets
         document.title at runtime, so these are static and describe the
         product. Absolute URLs: og:/twitter: crawlers do not resolve relative
         ones. Self-host builds serve the app from /deckpal on a private host
         where none of this is crawled — harmless there, correct on cloud. -->
    <title>DeckPal — Connect Claude to your Pokémon TCG collection</title>
    <meta
      name="description"
      content="Connect Claude to your own Pokémon TCG collection over MCP and ask what you can build from the cards you own, what is losing you games, and what to buy next. DeckPal tracks all 20,964 English cards down to the printing — set completion, price history, a PTCG Live deck builder and a camera scanner. Free and open source."
    />
    <link rel="canonical" href="https://deckpal.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeckPal" />
    <meta property="og:url" content="https://deckpal.app/" />
    <meta property="og:title" content="DeckPal — Connect Claude to your Pokémon TCG collection" />
    <meta
      property="og:description"
      content="Ask Claude what you can build from the cards you own. DeckPal hands your collection, decks, prices and battle logs to your own Claude over MCP — 21 tools, one connector. Free and open source."
    />
    <meta property="og:image" content="https://deckpal.app/marketing/og-image-1200.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="DeckPal — Pokémon TCG collection tracker" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeckPal — Connect Claude to your Pokémon TCG collection" />
    <meta
      name="twitter:description"
      content="Ask Claude what you can build from the cards you own. DeckPal hands your collection, decks, prices and battle logs to your own Claude over MCP — 21 tools, one connector. Free and open source."
    />
    <meta name="twitter:image" content="https://deckpal.app/marketing/og-image-1200.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DeckPal",
        "url": "https://deckpal.app/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "description": "Open-source Pokémon TCG collection tracker with an MCP server: connect your own Claude to your collection, decks, prices and battle logs through 21 tools. Per-printing collection tracking with set completion goals, daily price history and collection value over time, a deck builder with PTCG Live import/export and version history, battle-log parsing, a perceptual-hash card scanner, binders, lists and a Pokédex.",
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "codeRepository": "https://github.com/cheyras/deckpal",
        "author": { "@type": "Person", "name": "cheyras", "url": "https://github.com/cheyras" }
      }
    </script>
  </head>
  <body>
    <!--
      FIRST PAINT, BEFORE ANY JAVASCRIPT HAS RUN.

      `#root` used to be empty, so the browser painted `body`'s background and
      then had nothing else to show until the entry chunk had downloaded, parsed
      and mounted React. On a cold client that gap is real — issue #75 measured
      6.3 s of it on a throttled connection — and an empty dark page for six
      seconds is indistinguishable from a broken one. The reporter described
      exactly that: "a blank gray screen that wouldn't load for a while."

      The cause of the six seconds was a 1.2 MB three.js chunk on the critical
      path and it is fixed in `vite.config.ts`; this is the other half, because
      the gap can never be driven to zero and an unexplained blank page is the
      wrong thing to show for whatever remains of it.

      IT IS INLINE ON PURPOSE — markup, styles and all. A loading state that
      needs a request of its own cannot cover the wait for requests.

      IT FADES IN AFTER 350 ms rather than immediately, so a warm load (measured
      ~250 ms) shows nothing at all. A skeleton that flashes on every fast
      navigation is worse than no skeleton; this one only appears if the wait is
      long enough to need explaining.

      React clears it: `createRoot(...).render()` replaces the container's
      children on first commit, so there is nothing to tear down and no state to
      keep in sync. Do not move it outside `#root` — then it would need removing
      by hand, and the hand would eventually forget.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #1c1917;
        opacity: 0;
        animation: boot-in 0.4s ease 0.35s forwards;
      }
      #boot-card {
        width: 88px;
        height: 122px;
        border-radius: 8px;
        background: #292524;
        border: 1px solid #3a3532;
        position: relative;
        overflow: hidden;
      }
      /* A light sweep across the card face — the same gesture the app's own
         card tiles use while their art loads, so the wait looks like DeckPal
         rather than like a generic spinner. */
      #boot-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(0, 211, 243, 0.13) 50%,
          transparent 70%
        );
        transform: translateX(-100%);
        animation: boot-sweep 1.4s ease-in-out infinite;
      }
      #boot-word {
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.8125rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8b847e;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-sweep {
        to {
          transform: translateX(100%);
        }
      }
      /* Motion is decoration here; the card and the word carry the meaning. */
      @media (prefers-reduced-motion: reduce) {
        #boot {
          animation: boot-in 0.01s linear 0.35s forwards;
        }
        #boot-card::after {
          animation: none;
        }
      }
      #boot-stuck {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        background: #1c1917;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #d6d3d1;
      }
      #boot-stuck h1 {
        margin: 0;
        font-size: 1.0625rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #fafaf9;
      }
      #boot-stuck p {
        margin: 0;
        max-width: 30rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #a8a29e;
      }
      #boot-reload {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 999px;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        color: #06202a;
        background: #00d3f3;
        cursor: pointer;
      }
    </style>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div id="boot-card"></div>
        <div id="boot-word">Loading DeckPal</div>
      </div>
    </div>
    <!--
      FIRST-PAINT WATCHDOG.

      The boot state above explains a WAIT. It cannot explain a HANG, because
      React's first commit replaces `#root`'s children — so the moment the app
      mounts and then renders nothing, the "Loading DeckPal" card is gone and
      what is left is a bare dark page with no explanation and no way out.
      That is exactly what issue #75 reported, and exactly what a stalled
      `beforeLoad` produced: measured against a dev build with an auth endpoint
      that accepts and never answers, `#root` had 0 children 15 s in.

      The specific stall that caused it is fixed (src/lib/sessionDeadline.ts
      bounds the auth read). This is the backstop for every OTHER way first
      paint can fail to arrive — an entry chunk that 404s after a deploy, a
      module that throws at import, a route that never resolves, a service
      worker serving a shell whose scripts are gone. It cannot know the cause,
      so it does not guess: it says the honest thing and offers the one action
      that helps.

      IT IS INLINE, AND IT MUST STAY INLINE. A watchdog that needs a request of
      its own cannot cover a failure to fetch. It also runs BEFORE the module
      script below, so it is already armed if that script never arrives.

      "Painted" is read off the DOM rather than off a flag the app sets, so
      there is no cross-file contract to drift: the app has painted when `#root`
      has children and the boot card is no longer one of them. If React commits
      after this fires, it replaces these children like any others and the panel
      disappears on its own.
    -->
    <script>
      ;(function () {
        // Long enough that a genuinely slow cold load never sees it (#87
        // measured 6.3 s at its worst, 2.4 s after), short enough that nobody
        // sits in front of an unexplained page wondering.
        var LIMIT_MS = 12000
        function painted() {
          var root = document.getElementById('root')
          return !!root && root.childElementCount > 0 && !document.getElementById('boot')
        }
        var timer = setTimeout(function () {
          if (painted()) return
          try {
            performance.mark('deckpal:first-paint-watchdog')
          } catch (e) {}
          // The one line to ask a reporter for next time this happens.
          console.error(
            '[deckpal] first paint watchdog: no content after ' +
              LIMIT_MS +
              'ms at ' +
              location.pathname +
              ' (sw=' +
              (navigator.serviceWorker && navigator.serviceWorker.controller ? 'controlled' : 'none') +
              ')',
          )
          var root = document.getElementById('root')
          if (!root) return
          root.innerHTML =
            '<div id="boot-stuck" role="alert">' +
            '<h1>DeckPal is taking longer than usual</h1>' +
            '<p>The page has not finished loading. This is almost always a network that stalled ' +
            'mid-request. Reloading usually clears it; if it does not, closing this tab and ' +
            'opening deckpal.app again will.</p>' +
            '<button id="boot-reload" type="button">Reload</button>' +
            '</div>'
          var button = document.getElementById('boot-reload')
          if (button) {
            button.addEventListener('click', function () {
              location.reload()
            })
          }
        }, LIMIT_MS)
        // A page put in the back/forward cache is not a page that failed.
        window.addEventListener('pagehide', function () {
          clearTimeout(timer)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
