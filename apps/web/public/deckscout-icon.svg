<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233149"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- back card, fanned left -->
  <g transform="rotate(-14 256 268)">
    <rect x="163" y="118" width="186" height="264" rx="22" fill="#475569"/>
    <rect x="163" y="118" width="186" height="264" rx="22" fill="none" stroke="#64748b" stroke-width="6"/>
  </g>

  <!-- front card, fanned right -->
  <g transform="rotate(8 256 268)">
    <rect x="163" y="112" width="186" height="264" rx="22" fill="url(#cardface)"/>
    <!-- card art window -->
    <rect x="187" y="140" width="138" height="104" rx="10" fill="#334155"/>
    <!-- amber horizon detail inside art window -->
    <path d="M187 214 q40 -34 69 -12 q35 26 69 -6 v48 h-138 z" fill="url(#amber)" opacity="0.9"/>
    <!-- text bars -->
    <rect x="187" y="262" width="106" height="14" rx="7" fill="#94a3b8"/>
    <rect x="187" y="288" width="76" height="14" rx="7" fill="#b6c2d1"/>
  </g>

  <!-- scout magnifier -->
  <g>
    <circle cx="330" cy="330" r="78" fill="#0f172a" opacity="0.35"/>
    <circle cx="330" cy="330" r="70" fill="none" stroke="url(#amber)" stroke-width="26"/>
    <line x1="384" y1="384" x2="446" y2="446" stroke="url(#amber)" stroke-width="34" stroke-linecap="round"/>
    <!-- lens glint -->
    <path d="M292 300 a54 54 0 0 1 36 -22" fill="none" stroke="#fef3c7" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
