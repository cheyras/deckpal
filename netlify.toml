[build]
  command = "pnpm build && node scripts/prepare-netlify-data.mjs && pnpm --filter deckpal-web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.30.3"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "sharp"]
  included_files = ["netlify/functions/data/**"]

[[redirects]]
  from = "/api/scan/ai"
  to = "/.netlify/functions/scan-ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Card art and set imagery. Must sit ahead of the SPA fallback below, or every
# <img> resolves to index.html. The function lazily fills the card-art Storage
# bucket and 302s to the CDN.
[[redirects]]
  from = "/deckpal/images/*"
  to = "/.netlify/functions/images/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
