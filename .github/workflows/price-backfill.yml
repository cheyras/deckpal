# Price history backfill — replay TCGCSV's daily archives into price_observation.
#
# MANUAL ONLY. There is no `schedule:` here on purpose: this writes tens of
# millions of rows to the production database and its range is a decision with a
# storage bill attached, not something that should ever start on its own.
#
# ── What it is for ──────────────────────────────────────────────────────────
# Two jobs at once, both consequences of the 2026-08-08 sync outage
# (DECISIONS.md 2026-08-29):
#
#   1. REPAIR. The live endpoint serves only today, so the three weeks with no
#      prices looked unrecoverable. TCGCSV's per-day archives make them
#      recoverable with real observed prices rather than a value carried
#      forward and presented as market data.
#   2. HISTORY. The value chart could never show more past than the snapshot
#      job's own uptime — which is why every range chip drew the same ten days.
#      The owner's call was a two-year replay so 30d/3m/6m/1y/18m/2y all have
#      something real behind them.
#
# ── Cost, measured ──────────────────────────────────────────────────────────
# One archived day = 44,385 Pokémon price rows with a market price (counted from
# 2026-08-15). Two years is ~32M rows, ~3-4 GB with the primary key, and ~2.8 GB
# of downloads. Archives begin 2024-02-08; earlier dates 404.
#
# ── Why chunked, and how to resume ──────────────────────────────────────────
# A full replay is 5-10 hours and GitHub caps a job at 6. So `--limit` bounds
# each run to N days and the command SKIPS days that already have observations,
# which makes "run it again" the entire resume protocol — no cursor to keep, no
# state outside the data itself. The run reports `remaining`; when that is 0 the
# range is done. `auto_continue` re-dispatches this workflow until it reaches 0.
#
# ── Contracts ───────────────────────────────────────────────────────────────
# B2  PGPOOL_MAX=1 — a worker job.
# B8  Idempotent twice over: whole ingested days are skipped, and the row writer
#     is ON CONFLICT DO NOTHING on the natural key.
# B9  Writes catalogue price rows only. No Supabase settings, no Vercel config.
#     The RANGE is the owner's decision and is a required input for that reason.
name: Price history backfill

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'First day, YYYY-MM-DD (archives start 2024-02-08)'
        required: true
        default: '2024-08-29'
      to:
        description: 'Last day, YYYY-MM-DD'
        required: true
        default: '2026-08-29'
      limit:
        description: 'Max days to process in this run'
        required: true
        default: '45'
      auto_continue:
        description: 'Re-dispatch automatically until the range is complete'
        type: boolean
        default: true
      dry_run:
        description: 'Download and join, but write nothing'
        type: boolean
        default: false

# Never two replays at once: they would each be idempotent alone and still
# interleave per-day transactions against the same rows.
concurrency:
  group: price-backfill
  cancel-in-progress: false

# The Continue step re-dispatches this workflow, which the default GITHUB_TOKEN
# cannot do unless it may write to Actions. Declared rather than assumed: if the
# repository default is read-only, `gh workflow run` 403s and the chain stops
# after run 1, leaving the range half-done with nothing scheduled to resume it.
permissions:
  contents: read
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # under GitHub's 360 cap, with room to report
    env:
      PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
      PGPORT: ${{ secrets.SUPABASE_DB_PORT || '5432' }}
      PGDATABASE: ${{ secrets.SUPABASE_DB_NAME }}
      PGUSER: ${{ secrets.SUPABASE_DB_USER }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PGPOOL_MAX: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preflight — credentials present
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PGHOST:-}" ]     || missing+=(SUPABASE_DB_HOST)
          [ -n "${PGDATABASE:-}" ] || missing+=(SUPABASE_DB_NAME)
          [ -n "${PGUSER:-}" ]     || missing+=(SUPABASE_DB_USER)
          [ -n "${PGPASSWORD:-}" ] || missing+=(SUPABASE_DB_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Backfill is not configured::Missing repository secret(s): ${missing[*]}."
            exit 1
          fi

      # The archives are 7z/PPMd. Ubuntu runners ship p7zip, but `find7z()`
      # verifies rather than assuming — and installing here keeps the failure at
      # "apt could not install a package" rather than 45 downloads in.
      - name: Ensure 7z
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          fi
          7z i >/dev/null && echo "7z present"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build @deckpal/db
        run: pnpm --filter @deckpal/db build

      - name: Replay archives
        id: run
        run: |
          set -euo pipefail
          args="--from=${{ inputs.from }} --to=${{ inputs.to }} --limit=${{ inputs.limit }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          pnpm --filter deckpal-sync prices backfill $args | tee result.json
          # The command prints a single JSON object; `remaining` is the only
          # field that decides whether this needs running again.
          read -r remaining progressed <<<"$(node -e "
            const fs=require('fs');
            const t=fs.readFileSync('result.json','utf8');
            const i=t.indexOf('{'), j=t.lastIndexOf('}');
            const r=JSON.parse(t.slice(i,j+1));
            process.stdout.write(String(r.remaining ?? 0)+' '+String(r.progressed ?? 0));
          ")"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "progressed=$progressed" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining progressed=$progressed"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Price history backfill"
            echo ""
            echo "- range: \`${{ inputs.from }}\` → \`${{ inputs.to }}\`"
            echo "- days remaining after this run: **${{ steps.run.outputs.remaining }}**"
            echo ""
            echo '```json'
            cat result.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Self-chaining. A 730-day replay is ~16 runs at limit=45; doing that by
      # hand is 16 chances to forget.
      #
      # TWO conditions, not one. `remaining != 0` alone does NOT terminate: a day
      # TCGCSV never published can never gain observations, so it never leaves
      # the to-do set, and a range whose leftover days are all unpublished would
      # re-dispatch forever — a full checkout+install every few minutes against
      # the production database, achieving nothing. `progressed` is the number of
      # days that actually landed rows, so requiring it to be non-zero means each
      # chained run must do real work or the chain ends. A dry run never chains
      # (it writes nothing, so `progressed` is always 0).
      - name: Continue
        if: >-
          inputs.auto_continue &&
          inputs.dry_run != true &&
          steps.run.outputs.remaining != '0' &&
          steps.run.outputs.progressed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${{ steps.run.outputs.remaining }} day(s) left — dispatching the next chunk."
          gh workflow run price-backfill.yml \
            --ref "${{ github.ref_name }}" \
            -f from='${{ inputs.from }}' \
            -f to='${{ inputs.to }}' \
            -f limit='${{ inputs.limit }}' \
            -f auto_continue=true \
            -f dry_run=false
