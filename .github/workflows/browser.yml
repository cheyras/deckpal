name: Browser boundaries

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('./package.json').devDependencies.playwright)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and WebKit (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - name: Build browser shared packages
        run: |
          pnpm --filter @deckpal/storage build
          pnpm --filter @deckpal/matching build
          pnpm --filter @deckpal/db build
          pnpm --filter @deckpal/agent-tools build
      - name: Cloud and self-host browser journeys, rendered chat and deployment controls
        run: pnpm test:browser
        env:
          TEST_ARTIFACT_DIR: .cache/browser-tests
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-boundaries
          path: .cache/browser-tests/
          if-no-files-found: error
          retention-days: 14
