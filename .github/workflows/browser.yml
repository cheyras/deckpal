name: Browser boundaries

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    # Was 15. fix/offline-banner added tests/browser/offline.mjs (5 more
    # contexts, plus PwaUi/Sheet now in the fixture's own dependency graph for
    # the upfront tsconfig typecheck) on top of an already-large suite (57+
    # groups per tests/browser/README.md); a PR run hit the 15m ceiling with
    # both cloud and self-host admin/feedback journeys complete but the chat
    # fixture never reached (run 36267286821, 2026-09-26). 20 gives headroom
    # without masking a real hang — nothing in this suite should approach it.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build browser shared packages
        run: |
          pnpm --filter @deckpal/storage build
          pnpm --filter @deckpal/matching build
          pnpm --filter @deckpal/db build
          pnpm --filter @deckpal/agent-tools build
      - name: Cloud and self-host browser journeys, rendered chat and deployment controls
        run: pnpm test:browser
        env:
          TEST_ARTIFACT_DIR: .cache/browser-tests
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-boundaries
          path: .cache/browser-tests/
          if-no-files-found: error
          retention-days: 14
