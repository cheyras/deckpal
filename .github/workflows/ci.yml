# CI — every push to main (and any PR) must typecheck, pass the pure test
# suites, and build all deployables.
#
# Runs on GitHub-hosted ubuntu-latest — standard actions only.
#
# Deliberately NOT run here:
#   - test:collection (apps/api/src/__tests__) — those are live-DB integration
#     tests against the PRODUCTION deckpal database (self-cleaning, but CI
#     should never mutate prod data on every push). Run them manually.
#   - No Postgres service container — nothing in this workflow touches a
#     live database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # @deckpal/db is consumed via its dist/ (main: dist/index.js) — a fresh
      # workspace has none until it's built, and both tsc and the test suites
      # resolve the workspace link through it.
      - name: Build @deckpal/db
        run: pnpm --filter @deckpal/db build

      # @deckpal/storage holds the image path algebra shared by apps/images and
      # the cloud image function, and is consumed via its dist/ the same way.
      - name: Build @deckpal/storage
        run: pnpm --filter @deckpal/storage build

      # @deckpal/agent-tools holds the 23 tool definitions the MCP server and
      # Deck-E both serve. Same deal: consumed through its dist/, so it has to
      # be built before anything that imports it is loaded — which includes the
      # serverless-function check further down, since api/mcp.mjs pulls
      # apps/mcp/dist/cloud.js, which pulls this package.
      - name: Build @deckpal/agent-tools
        run: pnpm --filter @deckpal/agent-tools build

      - name: Typecheck all workspaces
        run: pnpm -r --workspace-concurrency=1 exec tsc --noEmit

      - name: Deck engine + battle-log parser tests (pure, no DB)
        run: pnpm --filter deckpal-api test:deck

      - name: Image path parsing + traversal rejection tests (pure, no DB)
        run: pnpm --filter deckpal-api test:images

      # Deck-E's server surface: the ad-hoc screen schema, whose whole guarantee
      # is that a model cannot express markup through it. Pure, no DB, no model.
      - name: Deck-E screen schema tests (pure, no DB)
        run: pnpm --filter deckpal-api test:decke

      # The variant-classification suite. It lives in `packages/agent-tools`
      # rather than in the API, because that is where `pickVariant` lives — and
      # it pins the HARD CONSTRAINT that the approval card's provenance is a NEW
      # field and not a change to that function's status semantics. Other flows
      # depend on the silent primary-variant default; turning those into errors
      # would be a regression well outside the change that needed the field.
      #
      # Its own step, because CI does not run `pnpm -r test` and an unwired
      # test never runs at all.
      #
      # The script's glob is the whole `src/__tests__` directory, so it also
      # runs the package's other pure suites — entity/card resolution, the
      # self-hop URL composition (`api-url.test.ts`, since issue #96), and
      # `toolErrors.test.ts`, which proves a `pg` error's message (built from
      # the connection parameters: host, role, DSN) cannot reach a tool result
      # and therefore a model's context. That one drives the real handlers
      # against a `ctx.db` that throws, so it needs no Postgres and does not
      # break contract B7.
      - name: Variant classification + agent-tools guards
        run: pnpm --filter @deckpal/agent-tools test:variants

      # The MCP wire result. Eleven tools pass metadata to `ok()`, and while the
      # adapter forwarded that as `structuredContent` a client was free to render
      # it INSTEAD of the answer — `search_cards` returned a row count and no
      # cards. Nothing errored, nothing logged, and re-introducing it is a
      # one-line edit that looks harmless. `apps/mcp` had no test script before
      # this; its own step, for the same reason as the row above.
      - name: MCP wire result (mcp adapter)
        run: pnpm --filter deckpal-mcp test:adapter

      # Every serverless function must LOAD. The unit tests exercise the pieces
      # a function imports and never the function itself, so a package that is
      # imported but not declared resolves locally by hoisting and 500s in
      # production. That shipped once; this is the guard.
      #
      # The two builds here are also THE api/mcp deployable builds for this
      # workflow — do not re-add separate "Build api"/"Build mcp" steps below.
      - name: Serverless functions load and export a handler
        run: |
          pnpm --filter deckpal-api build
          pnpm --filter deckpal-mcp build
          node scripts/check-functions.mjs

      # Deck-E's rig, playbook and procedural layers, checked against the
      # generated fixtures and against the glb's own bind pose. These existed
      # before this step did and were only ever run by hand -- which is how a
      # look-at solve that nothing consumed survived a full parity pass.
      - name: Deck-E character runtime tests (pure, no DB)
        run: pnpm --filter deckpal-web test:decke

      # The Insights caption logic (apps/web/src/lib/__tests__). Same story as
      # the step above: the suite existed and was only ever run by hand, and CI
      # does not run `pnpm -r test`, so an unwired suite never runs at all.
      - name: Insights caption tests (pure, no DB)
        run: pnpm --filter deckpal-web test:insights

      # Mass Entry line building (product-id lines, the all-or-nothing URL
      # split), idempotency key derivation, batch folding, and the source guard
      # that keeps every card_list/deck read filtering deleted_at.
      - name: Cart, idempotency, batch-fold and soft-delete guards (pure, no DB)
        run: pnpm --filter deckpal-api test:pure

      # The storage package's own pure suites:
      #   - the avatar choke point's guards — key shape, accepted magic bytes,
      #     and the record-before-publish ordering that keeps a failed upload
      #     from leaving a row behind (contract B1's shape for user uploads);
      #   - the SSRF boundary added for issue #96 — the upstream host allow-list
      #     and its per-redirect re-check (fetch-source.test.ts stands up two
      #     real loopback servers and asserts the non-allow-listed one is
      #     never contacted), the resolved-address classifier, and the
      #     object-key guard at every exported Storage function. That suite
      #     is the compensating control for a class CodeQL flags but cannot
      #     prove fixed locally.
      - name: Storage guards — avatar choke point + SSRF boundary (pure, no DB)
        run: pnpm --filter @deckpal/storage test

      # JWT verification plus the cloud/self-host identity seam. The live-DB
      # suites that would otherwise catch a self-host regression stay out of CI
      # by contract B7, so this pure suite is the compensating control: it
      # proves cloud-with-credential, cloud-without-credential (401, no
      # fallback) and self-host (single local user) without a Postgres.
      - name: Auth + request identity tests (pure, no DB)
        run: pnpm --filter deckpal-api test:auth

      # The address algebra behind `rekey:set` — which manifest rows an upstream
      # set-id rename puts in scope, and what their new path/cache key is. It
      # moves production bytes, so the part that can be proved without a database
      # or a bucket is proved on every push.
      - name: Image re-key address algebra (pure, no DB)
        run: pnpm --filter deckpal-images test

      - name: Build web
        run: pnpm --filter deckpal-web build

      - name: Build images
        run: pnpm --filter deckpal-images build
