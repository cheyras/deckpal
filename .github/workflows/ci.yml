# CI — every push to main (and any PR) must typecheck, pass the pure test
# suites, and build all deployables.
#
# Runs on GitHub-hosted ubuntu-latest — standard actions only.
#
# Deliberately NOT run here:
#   - test:collection (apps/api/src/__tests__) — those are live-DB integration
#     tests against the PRODUCTION deckscout database (self-cleaning, but CI
#     should never mutate prod data on every push). Run them manually.
#   - No Postgres service container — nothing in this workflow touches a
#     live database.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # @deckscout/db is consumed via its dist/ (main: dist/index.js) — a fresh
      # workspace has none until it's built, and both tsc and the test suites
      # resolve the workspace link through it.
      - name: Build @deckscout/db
        run: pnpm --filter @deckscout/db build

      # @deckscout/storage holds the image path algebra shared by apps/images and
      # the cloud image function, and is consumed via its dist/ the same way.
      - name: Build @deckscout/storage
        run: pnpm --filter @deckscout/storage build

      - name: Typecheck all workspaces
        run: pnpm -r --workspace-concurrency=1 exec tsc --noEmit

      - name: Deck engine + battle-log parser tests (pure, no DB)
        run: pnpm --filter deckscout-api test:deck

      - name: Image path parsing + traversal rejection tests (pure, no DB)
        run: pnpm --filter deckscout-api test:images

      # The storage package's own pure suites: the path algebra (paths.test.ts)
      # and the avatar choke point's guards — key shape, accepted magic bytes,
      # and the record-before-publish ordering that keeps a failed upload from
      # leaving a row behind (contract B1's shape for user uploads).
      - name: Storage path algebra + avatar choke point (pure, no DB)
        run: pnpm --filter @deckscout/storage test

      # JWT verification plus the cloud/self-host identity seam. The live-DB
      # suites that would otherwise catch a self-host regression stay out of CI
      # by contract B7, so this pure suite is the compensating control: it
      # proves cloud-with-credential, cloud-without-credential (401, no
      # fallback) and self-host (single local user) without a Postgres.
      - name: Auth + request identity tests (pure, no DB)
        run: pnpm --filter deckscout-api test:auth

      - name: Build api
        run: pnpm --filter deckscout-api build

      - name: Build mcp
        run: pnpm --filter deckscout-mcp build

      - name: Build web
        run: pnpm --filter deckscout-web build

      - name: Build images
        run: pnpm --filter deckscout-images build
